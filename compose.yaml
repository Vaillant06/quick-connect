services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: quickconnect
      POSTGRES_USER: quickconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickconnect_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      QC_APP_ENV: local
      QC_DATABASE_URL: postgresql+psycopg://quickconnect:${POSTGRES_PASSWORD:-quickconnect_dev_only}@db:5432/quickconnect
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      QC_APP_ENV: local
      QC_API_PREFIX: /api/v1
      QC_DATABASE_URL: postgresql+psycopg://quickconnect:${POSTGRES_PASSWORD:-quickconnect_dev_only}@db:5432/quickconnect
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      QC_APP_ENV: local
      QC_DATABASE_URL: postgresql+psycopg://quickconnect:${POSTGRES_PASSWORD:-quickconnect_dev_only}@db:5432/quickconnect
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
